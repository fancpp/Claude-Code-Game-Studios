#     revised: ""


# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions: []

# Example:
#
# api_decisions:
#   - purpose: physics_raycast
#     status: active
#     api: PhysicsServer3D.space_get_direct_state()
#     not: RayCast3D node     # explicitly banned for this purpose
#     adr: docs/architecture/adr-0002-physics-architecture.md
#     reason: "Direct server calls avoid per-frame node overhead; 3× faster in profiling"
#     referenced_by:
#       - docs/architecture/adr-0002-physics-architecture.md
#       - docs/architecture/adr-0003-combat-system.md
#     added: 2026-03-26
#     revised: ""


# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: grid_autoload
    status: active
    description: "Grid must not be implemented as a Godot Autoload singleton. Use class_name Grid extends RefCounted with dependency injection instead."
    why: "Autoload hides all grid dependencies, makes unit testing impossible without mocking, and creates tight coupling. Dependency injection via @export makes dependencies explicit and the grid trivially mockable for GUT tests."
    adr: docs/architecture/adr-0001-grid-system-pattern.md
    added: 2026-04-26

  - pattern: eventbus_autoload
    status: active
    description: "All signals must use native Godot signal syntax (signal keyword, emit_signal, connect). No central EventBus autoload singleton may mediate signal routing."
    why: "An EventBus autoload hides signal authorship — EventBus.emit('lines_cleared') doesn't reveal line_clear.gd as the source. It makes debugging harder, creates the same global singleton coupling as grid_autoload, and makes testing harder without mocking the singleton. Native signals are fully observable in the Godot debugger."
    adr: docs/architecture/adr-0002-signal-bus.md
    added: 2026-04-26

