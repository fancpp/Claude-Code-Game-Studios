name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gut-tests:
    name: GUT Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot
        run: |
          curl -sL "https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6-stable_linux.x86_64
          mv Godot_v4.6-stable_linux.x86_64 /usr/local/bin/godot

      - name: Run GUT tests
        run: |
          godot --headless --script tests/gdunit4_runner.gd
        continue-on-error: false

  smoke-test:
    name: Headless Smoke Test
    runs-on: ubuntu-latest
    needs: gut-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot
        run: |
          curl -sL "https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6-stable_linux.x86_64
          mv Godot_v4.6-stable_linux.x86_64 /usr/local/bin/godot

      - name: Run headless smoke test
        run: |
          godot --headless --script tests/e2e/game_smoke.gd
        continue-on-error: false