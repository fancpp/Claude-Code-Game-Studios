name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gut-tests:
    name: GUT Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run GUT tests
        uses: croconut/godot-tester@v5.2
        with:
          version: "4.6"
          release_type: "stable"
          path: "./"
          test-dir: "res://tests/unit"
          minimum-pass: "0.8"
          test-timeout: "120"

  smoke-test:
    name: Headless Smoke Test
    runs-on: ubuntu-latest
    needs: gut-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke test
        uses: croconut/godot-tester@v5.2
        with:
          version: "4.6"
          release_type: "stable"
          path: "./"
          test-dir: "res://tests/e2e"
          minimum-pass: "0.5"
          test-timeout: "60"