# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: can_move_to
    status: active
    source: design/gdd/collision-system.md
    referenced_by:
      - design/gdd/tetromino-system.md
      - design/gdd/ghost-piece-system.md
      - design/gdd/piece-spawn-system.md
    variables:
      - tx  # target x
      - ty  # target y
      - shape  # tetromino shape array
    output_range: [0, 1]  # 0=false, 1=true
    expression: "AND(for all (cx,cy) in shape: is_valid_position(tx+cx, ty+cy) AND is_empty(tx+cx, ty+cy))"
    notes: "Pure collision query — reads grid, never writes"
    added: 2026-04-26
    revised: ""

  - name: combo_multiplier_formula
    status: active
    source: design/gdd/combo-scoring-system.md
    referenced_by:
      - design/gdd/score-display-system.md
    variables:
      - combo_counter
    output_range: [1, 5]
    expression: "min(combo_counter, MAX_COMBO_MULTIPLIER)"
    notes: "Combo multiplier capped at 5"
    added: 2026-04-26
    revised: ""

  - name: score_formula
    status: active
    source: design/gdd/combo-scoring-system.md
    referenced_by:
      - design/gdd/score-display-system.md
    variables:
      - base_points  # per line, from BASE_POINTS table
      - lines_cleared
      - combo_multiplier
    output_range: [0, 999999]
    expression: "BASE_POINTS[lines_cleared] × lines_cleared × combo_multiplier"
    notes: "Single=100×1×combo, Double=300×2×combo, Triple=500×3×combo, Tetris=800×4×combo"
    added: 2026-04-26
    revised: ""

  - name: drop_interval_formula
    status: active
    source: design/gdd/speed-progression-system.md
    referenced_by:
      - design/gdd/tetromino-system.md
    variables:
      - level
      - initial_drop_interval (1000ms)
      - speed_increment (50ms per level)
      - drop_interval_min (100ms cap)
    output_range: [100, 1000]  # ms
    expression: "max(DROP_INTERVAL_MIN, INITIAL_DROP_INTERVAL - (level - 1) × SPEED_INCREMENT)"
    notes: "Level 1 = 1000ms, Level 15 = 100ms (capped)"
    added: 2026-04-26
    revised: ""

  - name: ghost_drop_formula
    status: active
    source: design/gdd/ghost-piece-system.md
    referenced_by:
      - design/gdd/ghost-piece-system.md
    variables:
      - piece_x
      - piece_y
      - piece_shape
    output_range: [0, 19]  # ghost Y position
    expression: "ghost_y = piece_y; while can_move_to(piece_x, ghost_y-1, shape): ghost_y -= 1"
    notes: "Ray-casts downward until blocked or floor"
    added: 2026-04-26
    revised: ""

  - name: das_trigger_formula
    status: active
    source: design/gdd/input-system.md
    referenced_by:
      - design/gdd/input-system.md
    variables:
      - T (elapsed time ms)
      - D_initial (170ms initial delay)
      - R (50ms repeat rate)
    output_range: [0, unlimited]
    expression: "N = floor((T - D_initial) / R) when T > D_initial, else N = 0"
    notes: "DAS triggers first repeat after 170ms, then every 50ms"
    added: 2026-04-26
    revised: ""


